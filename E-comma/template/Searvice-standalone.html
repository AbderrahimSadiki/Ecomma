<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>E-comma - E-commanics Website Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries & base CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Style with primary replaced by #e1251a -->
    <style>
        :root {
            --bs-primary: #e1251a !important;
        }

        body {
            font-family: 'Open Sans', sans-serif;
        }

        /* Service block styles */
        .service-row {
            max-width: 1180px;
            margin: 0 auto;
        }

        .service-item {
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .service-item i {
            font-size: 32px;
            color: #e1251a !important; /* icônes en rouge */
            min-width: 44px;
        }

        .service-item h6 {
            font-size: 0.95rem;
            margin: 0 0 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .service-item p {
            margin: 0;
            color: #666;
        }

        .border-start {
            border-left: 1px solid rgba(0, 0, 0, 0.06);
        }

        .border-end {
            border-right: 1px solid rgba(0, 0, 0, 0.06);
        }

        /* Bootstrap overrides */
        .text-primary {
            color: #e1251a !important;
        }

        .bg-primary {
            background-color: #e1251a !important;
        }

        .btn-primary {
            background-color: #e1251a !important;
            border-color: #e1251a !important;
            color: #ffffff !important;
        }

        .btn-primary:hover {
            background-color: #b21712 !important;
            border-color: #b21712 !important;
        }

        .col-6.col-md-4.col-lg-2 {
            display: flex;
            align-items: stretch
        }

        /* responsive small tweaks */
        @media (max-width: 576px) {
            .service-item i {
                font-size: 28px;
            }

            .service-item h6 {
                font-size: 0.85rem
            }
        }
    </style>
</head>

<body>

    <!-- Services Start -->
    <div class="container-fluid px-0">
        <div class="row g-0">
            <div class="col-6 col-md-4 col-lg-2 border-start border-end wow fadeInUp" data-wow-delay="0.1s">
                <div class="p-4">
                    <div class="d-inline-flex align-items-center">
                        <i class="fa fa-sync-alt fa-2x text-primary"></i>
                        <div class="ms-4">
                            <h6 class="text-uppercase mb-2">Free Return</h6>
                            <p class="mb-0">30 days money back guarantee!</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 border-end wow fadeInUp" data-wow-delay="0.2s">
                <div class="p-4">
                    <div class="d-flex align-items-center">
                        <i class="fab fa-telegram-plane fa-2x text-primary"></i>
                        <div class="ms-4">
                            <h6 class="text-uppercase mb-2">Free Shipping</h6>
                            <p class="mb-0">Free shipping on all order</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 border-end wow fadeInUp" data-wow-delay="0.3s">
                <div class="p-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-life-ring fa-2x text-primary"></i>
                        <div class="ms-4">
                            <h6 class="text-uppercase mb-2">Support 24/7</h6>
                            <p class="mb-0">We support online 24 hrs a day</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 border-end wow fadeInUp" data-wow-delay="0.4s">
                <div class="p-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-credit-card fa-2x text-primary"></i>
                        <div class="ms-4">
                            <h6 class="text-uppercase mb-2">Receive Gift Card</h6>
                            <p class="mb-0">Recieve gift all over oder DH 50</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 border-end wow fadeInUp" data-wow-delay="0.5s">
                <div class="p-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-lock fa-2x text-primary"></i>
                        <div class="ms-4">
                            <h6 class="text-uppercase mb-2">Secure Payment</h6>
                            <p class="mb-0">We Value Your Security</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2 border-end wow fadeInUp" data-wow-delay="0.6s">
                <div class="p-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-blog fa-2x text-primary"></i>
                        <div class="ms-4">
                            <h6 class="text-uppercase mb-2">Online Service</h6>
                            <p class="mb-0">Free return products in 30 days</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Services End -->

    <!-- simple WOW.js replacement -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const elements = document.querySelectorAll('.wow');
            if ('IntersectionObserver' in window && elements.length) {
                const io = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const el = entry.target;
                            const delay = el.getAttribute('data-wow-delay') || '0s';
                            el.style.setProperty('--animate-delay', delay);
                            el.classList.add('animate__animated', 'animate__fadeInUp');
                            obs.unobserve(el);
                        }
                    });
                }, { threshold: 0.15 });
                elements.forEach(el => io.observe(el));
            } else {
                elements.forEach(el => el.classList.add('animate__animated', 'animate__fadeInUp'));
            }
        });
    </script>

</body>

</html>
